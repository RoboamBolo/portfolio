backend:
  name: github
  repo: VOTRE-USERNAME/VOTRE-REPO
  branch: main
  site_domain: VOTRE-SITE.netlify.app

media_folder: "gallery"
public_folder: "/gallery"

collections:
  - name: "content"
    label: "Contenu du Portfolio"
    editor:
      preview: true
    files:
      - name: "translations"
        label: "Traductions"
        file: "data/content.json"
        fields:
          - name: "en"
            label: "🇬🇧 English"
            widget: "object"
            fields:
              - name: "site"
                label: "Site"
                widget: "object"
                fields:
                  - { name: "title", label: "Titre", widget: "string" }
                  - name: "nav"
                    label: "Navigation"
                    widget: "object"
                    fields:
                      - { name: "home", label: "Accueil", widget: "string" }
                      - { name: "projects", label: "Projets", widget: "string" }
                      - { name: "about", label: "À propos", widget: "string" }
                      - { name: "contact", label: "Contact", widget: "string" }
              - name: "hero"
                label: "Section Hero"
                widget: "object"
                fields:
                  - { name: "title", label: "Titre", widget: "string" }
                  - { name: "subtitle", label: "Sous-titre", widget: "string" }
                  - { name: "cta", label: "Bouton CTA", widget: "string" }
              - name: "projects"
                label: "Projets"
                widget: "object"
                fields:
                  - { name: "title", label: "Titre de la section", widget: "string" }
                  - name: "project1"
                    label: "Projet 1"
                    widget: "object"
                    fields:
                      - { name: "title", label: "Titre", widget: "string" }
                      - { name: "description", label: "Description", widget: "text" }
                      - { name: "tags", label: "Tags", widget: "list", default: ["React", "Node.js"] }
                  - name: "project2"
                    label: "Projet 2"
                    widget: "object"
                    fields:
                      - { name: "title", label: "Titre", widget: "string" }
                      - { name: "description", label: "Description", widget: "text" }
                      - { name: "tags", label: "Tags", widget: "list", default: ["HTML", "CSS", "JavaScript"] }
                  - name: "project3"
                    label: "Projet 3"
                    widget: "object"
                    fields:
                      - { name: "title", label: "Titre", widget: "string" }
                      - { name: "description", label: "Description", widget: "text" }
                      - { name: "tags", label: "Tags", widget: "list", default: ["Python", "TensorFlow"] }
                  - name: "project4"
                    label: "Projet 4"
                    widget: "object"
                    fields:
                      - { name: "title", label: "Titre", widget: "string" }
                      - { name: "description", label: "Description", widget: "text" }
                      - { name: "tags", label: "Tags", widget: "list", default: ["Flutter", "Firebase"] }
              - name: "about"
                label: "À propos"
                widget: "object"
                fields:
                  - { name: "title", label: "Titre", widget: "string" }
                  - { name: "content", label: "Contenu", widget: "text" }
                  - { name: "skills", label: "Compétences", widget: "text" }
              - name: "contact"
